name: Release widget

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout widget
        uses: actions/checkout@v7

      - name: Install Lua
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install lua

      - name: Validate and test
        run: make check

      - name: Resolve release
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          name="$(scripts/python.sh -c 'import tomllib; print(tomllib.load(open("package.toml", "rb"))["name"])')"
          version="$(scripts/python.sh -c 'import tomllib; print(tomllib.load(open("package.toml", "rb"))["version"])')"
          expected_tag="${name}-v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match package $expected_tag" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build deterministic archive
        id: archive
        run: scripts/python.sh scripts/widget.py package --version "${{ steps.package.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Write registry metadata summary
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo '### Registry version metadata'
            echo
            echo '```toml'
            echo '[[versions]]'
            echo "version = \"$VERSION\""
            echo "archive = \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${PACKAGE}-${VERSION}.tar.gz\""
            echo "sha256 = \"$SHA256\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
